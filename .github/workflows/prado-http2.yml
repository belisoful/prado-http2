name: PRADO HTTP/2 Extension
on:
  push:
  pull_request:
  schedule:
    # The extension tracks PRADO's master branch, so a change there can break a build that no
    # commit here triggered. Once a week catches that.
    - cron: '23 6 * * 1'
  workflow_dispatch:
jobs:
  composerext:
    name: Tests (PHP ${{ matrix.php-versions }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        php-versions: ['8.2', '8.3', '8.4', '8.5']

    defaults:
      run:
        working-directory: prado-http2

    steps:
      - name: Checkout extension
        uses: actions/checkout@v7
        with:
          path: prado-http2

      - name: Checkout PRADO framework (4.4 dev)
        uses: actions/checkout@v7
        with:
          repository: pradosoft/prado
          ref: master
          path: prado

      - name: Install libnghttp2
        timeout-minutes: 10
        run: sudo apt-get update && sudo apt-get install -y libnghttp2-dev

      - name: Setup PHP, with composer and extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: ctype, dom, ffi, intl, json, mbstring, openssl, pcre, spl, zlib
          tools: php-cs-fixer, phpstan, cs2pr

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Validate code syntax using php-cs-fixer
        run: php-cs-fixer fix -vvv --dry-run --using-cache=no --format=checkstyle | cs2pr

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ matrix.php-versions }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-php${{ matrix.php-versions }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Validate code using phpstan
        run: phpstan analyse --error-format=checkstyle | cs2pr

      - name: Run Unit Tests
        run: composer unittest

      - name: Run Functional Tests (HTTP/2 interop via curl)
        run: composer functest
